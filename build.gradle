plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
}

loom {
    accessWidenerPath = file("src/main/resources/tc_veinminer.accesswidener")
    splitEnvironmentSourceSets()
    mods {
        "tc_veinminer" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def mcVersion = project.hasProperty("minecraft_version") ? project.minecraft_version : "1.21.1"
def yarnMappings = project.hasProperty("yarn_mappings") ? project.yarn_mappings : "1.21.1+build.3"
def fabricVersion = project.hasProperty("fabric_version") ? project.fabric_version : "0.102.0+1.21.1"
def javaVersion = project.hasProperty("java_version") ? project.java_version.toInteger() : 21
def clothConfigVersion = project.hasProperty("cloth_config_version") ? project.cloth_config_version : "15.0.140"
def modmenuVersion = project.hasProperty("modmenu_version") ? project.modmenu_version : "11.0.3"

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

    // Cloth Config - config GUI
    modApi("me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // ModMenu - tích hợp vào menu Mods
    modImplementation "com.terraformersmc:modmenu:${modmenuVersion}"

    // Gson cho config serialization (bundled với MC)
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
